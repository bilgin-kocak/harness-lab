name: Release to PyPI

# The trusted publisher for this repository (workflow "release.yml", environment "pypi") is
# registered on pypi.org. To release, follow docs/project/releasing.md, then push a tag:
#   git tag -a vX.Y.Z -m "harnesslab X.Y.Z" && git push origin vX.Y.Z

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
