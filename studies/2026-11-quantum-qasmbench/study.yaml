# Pre-registered study: Qiskit compilation of QASMBench circuits.
# Plan: docs/plans/2026-11-22-math-quantum-experiment-plan.md, part B (option B: pools A and B),
# with the amendments of B14 and B15 (made before any search cell ran).
# Run: harnesslab study check|search|freeze|heldout|report studies/2026-11-quantum-qasmbench/study.yaml
name: 2026-11-quantum-qasmbench
adapter: qiskit-qasmbench
adapter_options:
  # A QASMBench checkout at the pinned commit (357b942): set HARNESSLAB_QASMBENCH_DIR, or let the
  # adapter clone it into its cache.
  fetch: true
  exact_max_active_qubits: 14
  qcec_timeout_s: 60
  qcec_kill_s: 90
  qcec_on_pool_a: true
  compile_repeats: 3
  # B14.3: all repetitions of one attempt together; past it the attempt is a timeout (infeasible).
  compile_timeout_s: 1200
  # B15.6: target validity, counts and the exact check of one output; past it: unverifiable.
  analyze_timeout_s: 1200
  workers: 3

split:
  file: split.json
  dev: [assignment.A.dev, assignment.B.dev]
  held_out: [assignment.A.held_out, assignment.B.held_out]
  hashes: [circuits]

parallelism: 3
keep_dev_artifacts: false

search:
  seed: 20261122
  stages:
    # B7 step 0: the baseline on every dev circuit, before any candidate; the level-3 comparator
    # is reported on dev too.
    - name: baseline
      kind: explicit
      configs:
        - {label: baseline, set: {}}
        - {label: opt3, set: {optimization_level: 3}}
    # B5 stage 1: the full grid of the main knobs, other knobs at their defaults, on the dev
    # circuits whose baseline output verified. B14.1: lookahead routing is not searched (720).
    - name: stage1
      kind: grid
      knobs: [optimization_level, layout_method, routing_method, translation_method, seed_transpiler]
      levels:
        routing_method: [default, basic, sabre]
      tasks_from: baseline_verified
    # B5 stage 2: the 10 best feasible configurations x synthesis and approximation choices.
    # B14.2: hls_mcx is not searched (no dev circuit has an MCX gate): 40, of which 30 new.
    - name: stage2
      kind: refine
      top_k: 10
      knobs: [approximation_degree, qubits_initially_zero]
      tasks_from: baseline_verified

objective:
  kind: baseline_ratio
  metrics: [two_qubit_gates, depth]
  then: [compile_time_s]
  offset: 1.0
  tie_tolerance: 1.0e-9
  drop_tasks_where_baseline_unverified: true

budget:
  # B10: at most 1,100 configurations (752 after B14) and 8 CPU-hours including verification.
  max_attempts: 30000
  # B15.10: 48 cell-hours (B10 had 8; a dev-only timing probe showed it covers about a third
  # of stage 1). Cell time is wall time per cell, summed over cells.
  max_cell_seconds: 172800

held_out:
  repetitions: 1
  order_seed: 20261122
  comparators:
    - {label: opt3, base: baseline, set: {optimization_level: 3}}
  robustness:
    knob: seed_transpiler
    levels: [1001, 1002, 1003, 1004, 1005]
    configs: [baseline, frozen]
  require_committed_freeze: true

stats:
  resamples: 10000
  seed: 20261122
  level: 0.95
  report_metrics: [compile_time_s, size]
  # B11: results per pool as well as overall (the adapter tags each circuit with its pool).
  tag_groups: [A, B]
