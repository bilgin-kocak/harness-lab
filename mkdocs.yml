site_name: Harness Lab
site_description: >-
  Controlled experiments for AI coding-agent harnesses: the same task from the same commit,
  a hidden-test verifier, cost and paired statistics.
site_url: https://bilgin-kocak.github.io/harness-lab/
site_author: Bilgin Kocak
repo_url: https://github.com/bilgin-kocak/harness-lab
repo_name: bilgin-kocak/harness-lab
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
exclude_docs: |
  superpowers/
  SUMMARY.md

theme:
  name: material
  custom_dir: overrides  # main.html: link previews (Open Graph), nothing else
  favicon: assets/brand/favicon.png
  icon:
    logo: material/flask-outline
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

extra_css:
  - stylesheets/harnesslab.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bilgin-kocak/harness-lab
      name: Source on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/harnesslab/
      name: harnesslab on PyPI

copyright: Copyright &copy; 2026 Bilgin Kocak · MIT License

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      strict: true  # a misspelt icon fails the build instead of printing :material-x:
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

# GitBook reads docs/SUMMARY.md and opens on start/overview.md; tests/test_docs.py keeps this nav
# and SUMMARY.md in sync, except the MkDocs-only landing page (index.md).
nav:
  - Home: index.md
  - Start here:
      - Overview: start/overview.md
      - Tour: start/tour.md
      - Install: start/install.md
      - Quickstart: start/quickstart.md
      - Concepts: start/concepts.md
  - Guides:
      - Run Claude Code: guides/claude-code.md
      - Run Codex: guides/codex.md
      - Run pi: guides/pi.md
      - Run OpenCode: guides/opencode.md
      - Run Hermes Agent: guides/hermes.md
      - Test your own harness: guides/your-own-harness.md
      - Write a task suite: guides/task-suites.md
      - Mine tasks from git history: guides/task-corpus.md
      - Configuration sweeps: guides/sweeps.md
      - Grow the harness: guides/growing.md
      - Ablate a harness: guides/ablation.md
      - Improvement tasks: guides/improvement.md
      - Safety: guides/safety.md
      - Find-everything tasks: guides/discovery.md
      - Recovery tasks: guides/recovery.md
      - The dashboard: guides/dashboard.md
      - Read and export results: guides/results.md
  - Reference:
      - CLI: reference/cli.md
      - Task and suite YAML: reference/task-and-suite-format.md
      - Experiment YAML: reference/experiment-format.md
      - Sweep YAML: reference/sweep-format.md
      - Grow YAML: reference/grow-format.md
      - Harness bundle: reference/bundle-format.md
      - Metrics: reference/metrics.md
      - Events: reference/events.md
      - Python API: reference/python-api.md
      - Storage and data layout: reference/storage.md
      - Pricing table: reference/pricing.md
  - Explanations:
      - Research principles: explanations/research-principles.md
      - Security model: explanations/security-model.md
      - What the optimizer sees: explanations/optimizer-view.md
      - The Growing Harness paper: explanations/growing-harness-paper.md
      - Honest limits: explanations/limits.md
  - Project:
      - Changelog: project/changelog.md
      - Roadmap: project/roadmap.md
      - Contributing: project/contributing.md
      - Releasing: project/releasing.md
