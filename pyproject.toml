[project]
name = "harnesslab"
dynamic = ["version"]
description = "Local-first experimentation platform for evaluating AI coding-agent harnesses: same task, isolated worktrees, independent verifier, normalized traces, cheapest verified configuration."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bilgin Kocak" }]
keywords = ["ai-agents", "coding-agents", "benchmark", "evaluation", "harness", "claude-code", "codex", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/bilgin-kocak/harness-lab"
Repository = "https://github.com/bilgin-kocak/harness-lab"
Issues = "https://github.com/bilgin-kocak/harness-lab/issues"
Changelog = "https://github.com/bilgin-kocak/harness-lab/blob/main/CHANGELOG.md"

[project.scripts]
harnesslab = "harnesslab.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "twine>=5.0",
]
docs = [
    "mkdocs-material>=9.7.7",
]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/harnesslab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/harnesslab"]

[tool.hatch.build.targets.sdist]
include = ["src/harnesslab", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pricing.example.yaml", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that invoke real external CLIs (skipped unless HARNESSLAB_INTEGRATION=1)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/harnesslab/bundled"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
